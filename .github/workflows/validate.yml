name: Validate static site
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate incident dataset
        run: python tests/validate_data.py
      - name: Validate GISTDA importer (synthetic fixture only)
        run: python tests/validate_pm25.py
      - name: Check JavaScript syntax
        run: node --check assets/app.js